name: Phase 1 Go Scientific Core

on:
  workflow_dispatch:
  push:
    branches:
      - r3-offline
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - '.github/workflows/phase1-go-test.yml'

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Format gate
        shell: bash
        run: |
          bad=$(gofmt -l cmd internal)
          if [ -n "$bad" ]; then
            printf 'Files not gofmt formatted:\n%s\n' "$bad"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Scientific core tests
        run: go test ./... -count=1
