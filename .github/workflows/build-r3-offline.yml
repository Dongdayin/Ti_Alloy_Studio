name: Build Phase 3 Offline Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - r3-offline
    tags:
      - 'r3-offline-*'

permissions:
  contents: read

jobs:
  build-windows-offline:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Set up Python 3.11 release-builder runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Build verified fully-offline installer
        shell: pwsh
        run: ./scripts/build_r3_offline.ps1

      - name: Verify final manual byte identity
        shell: pwsh
        run: |
          $expected='0389d2d967023c2a77fafc1e15ec0dfde28e0725b354672388ae2892a78edfda'
          $docs=(Get-FileHash -Algorithm SHA256 'docs\TiAlloyStudio-Manual.docx').Hash.ToLowerInvariant()
          $payload=(Get-FileHash -Algorithm SHA256 'internal\installer\payload\TiAlloyStudio-Manual.docx').Hash.ToLowerInvariant()
          if ($docs -ne $expected -or $payload -ne $expected) { throw "Manual identity failed: docs=$docs payload=$payload" }
          Write-Host "manual-sha256=$docs"

      - name: Run Windows-native core smoke test before install
        shell: pwsh
        run: |
          $smoke="$env:RUNNER_TEMP\tialloy-preinstall-native.json"
          $proc=Start-Process -FilePath '.\internal\installer\payload\TiAlloyStudio.exe' -ArgumentList @('--smoke-test-file',$smoke) -Wait -PassThru
          if (Test-Path $smoke) { Get-Content $smoke }
          else { throw 'Smoke JSON file was not created.' }
          if ($proc.ExitCode -ne 0) { throw "Windows pre-install native smoke executable failed with exit $($proc.ExitCode)" }
          $native=Get-Content $smoke -Raw | ConvertFrom-Json
          if ($native.result.status -ne 'PASS') { throw 'Windows pre-install native smoke failed' }

      - name: Verify payload is offline and complete
        shell: pwsh
        run: |
          $bundle = 'internal\installer\payload\engine-bundle.zip'
          if ((Get-Item $bundle).Length -lt 50MB) { throw 'Engine bundle too small' }
          if (Select-String -Path 'internal\installer\installer.go','cmd\installer\main.go' -Pattern 'Invoke-WebRequest|https?://|pip install --upgrade' -Quiet) {
            throw 'End-user installer source contains forbidden online-install behavior'
          }

      - name: Seed the pre-existing CPython state that caused the field failure
        shell: pwsh
        run: |
          $setup=Join-Path $env:RUNNER_TEMP 'python-3.11.9-amd64.exe'
          $existing=Join-Path $env:RUNNER_TEMP 'Existing-Python-3.11.9'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe' -OutFile $setup
          $args=@('/quiet','InstallAllUsers=0',("TargetDir=$existing"),'Include_pip=0','Include_launcher=0','InstallLauncherAllUsers=0','AssociateFiles=0','Shortcuts=0','PrependPath=0','Include_doc=0','Include_test=0','Include_tcltk=0')
          $proc=Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Conflicting CPython seed failed with exit $($proc.ExitCode)" }
          if (-not (Test-Path "$existing\python.exe")) { throw 'Conflicting CPython seed did not create python.exe' }
          $before=(Get-FileHash -Algorithm SHA256 "$existing\python.exe").Hash.ToLowerInvariant()
          "TI_ALLOY_EXISTING_PYTHON=$existing" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TI_ALLOY_EXISTING_PYTHON_HASH=$before" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "pre-existing-python-regression-state-PASS path=$existing sha256=$before"

      - name: Clean-install final offline installer
        shell: pwsh
        run: |
          $install=Join-Path $env:RUNNER_TEMP 'Ti Alloy Studio Clean Install'
          $diag=Join-Path $env:RUNNER_TEMP 'TiAlloyStudio-install-error.log'
          Remove-Item $diag -Force -ErrorAction SilentlyContinue
          if (Test-Path $install) { Remove-Item $install -Recurse -Force }
          # Start-Process joins an ArgumentList array into a command line without
          # quoting individual values. Preserve the space-containing path as one
          # argument and keep --no-launch before any possible positional token.
          $installerArgs="--quiet --no-launch --install-dir `"$install`""
          $proc=Start-Process -FilePath '.\dist\TiAlloyStudio-Setup-x64-Offline.exe' -ArgumentList $installerArgs -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $diag) {
              Write-Host '===== preserved installer diagnostic ====='
              Get-Content $diag
              Write-Host '===== end installer diagnostic ====='
            } else {
              Write-Host 'Installer did not create the expected preserved diagnostic file.'
            }
            throw "Offline installer exited $($proc.ExitCode)"
          }
          if (-not (Test-Path "$install\TiAlloyStudio.exe")) { throw 'Installed application missing' }
          if (-not (Test-Path "$install\engines\python\python.exe")) { throw 'Installed private Python runtime missing' }
          if (-not (Test-Path "$install\engines\atomsk\atomsk.exe")) { throw 'Installed Atomsk missing' }
          if (-not (Test-Path "$env:TI_ALLOY_EXISTING_PYTHON\python.exe")) { throw 'App installation damaged the pre-existing Python runtime' }
          $existingAfter=(Get-FileHash -Algorithm SHA256 "$env:TI_ALLOY_EXISTING_PYTHON\python.exe").Hash.ToLowerInvariant()
          if ($existingAfter -ne $env:TI_ALLOY_EXISTING_PYTHON_HASH) { throw 'App installation modified the pre-existing Python runtime' }
          $expected='0389d2d967023c2a77fafc1e15ec0dfde28e0725b354672388ae2892a78edfda'
          $installedManual=(Get-FileHash -Algorithm SHA256 "$install\TiAlloyStudio-Manual.docx").Hash.ToLowerInvariant()
          if ($installedManual -ne $expected) { throw "Installed manual hash mismatch: $installedManual" }
          reg.exe QUERY 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\TiAlloyStudio' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows uninstall registration missing' }
          "TI_ALLOY_CLEAN_INSTALL=$install" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run installed native and mature-engine smoke tests
        shell: pwsh
        run: |
          $install=$env:TI_ALLOY_CLEAN_INSTALL
          $nativePath="$env:RUNNER_TEMP\tialloy-installed-native.json"
          $nativeProc=Start-Process -FilePath "$install\TiAlloyStudio.exe" -ArgumentList @('--smoke-test-file',$nativePath) -Wait -PassThru
          if (Test-Path $nativePath) { Get-Content $nativePath }
          else { throw 'Installed native smoke JSON was not created.' }
          if ($nativeProc.ExitCode -ne 0) { throw "Installed native smoke executable failed with exit $($nativeProc.ExitCode)" }
          $native=Get-Content $nativePath -Raw | ConvertFrom-Json
          if ($native.result.status -ne 'PASS') { throw 'Installed native scientific smoke failed' }
          $enginePath="$env:RUNNER_TEMP\tialloy-installed-engines.json"
          $engineProc=Start-Process -FilePath "$install\TiAlloyStudio.exe" -ArgumentList @('--engine-smoke-file',$enginePath) -Wait -PassThru
          if (Test-Path $enginePath) { Get-Content $enginePath }
          else { throw 'Installed mature-engine smoke JSON was not created.' }
          if ($engineProc.ExitCode -ne 0) { throw "Installed engine smoke executable failed with exit $($engineProc.ExitCode)" }
          $engine=Get-Content $enginePath -Raw | ConvertFrom-Json
          if ($engine.status -ne 'PASS') { throw 'Installed mature-engine cross-check failed' }

      - name: Verify uninstall from clean installation
        shell: pwsh
        run: |
          $install=$env:TI_ALLOY_CLEAN_INSTALL
          Get-ChildItem $env:TEMP -Filter 'TiAlloyStudio-remove-*.cmd' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          $uninstallProc=Start-Process -FilePath "$install\Uninstall.exe" -ArgumentList @('--uninstall','--quiet') -PassThru
          $exited=$uninstallProc.WaitForExit(30000)
          if (-not $exited) {
            Write-Host "Uninstaller PID $($uninstallProc.Id) did not exit within 30 seconds."
            Get-CimInstance Win32_Process | Where-Object {
              $_.ProcessId -eq $uninstallProc.Id -or $_.ParentProcessId -eq $uninstallProc.Id
            } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List | Out-Host
            Stop-Process -Id $uninstallProc.Id -Force -ErrorAction SilentlyContinue
            throw 'Uninstaller process timeout'
          }
          if ($uninstallProc.ExitCode -ne 0) { throw "Uninstaller exited $($uninstallProc.ExitCode)" }

          $deleted=$false
          for ($i=1; $i -le 120; $i++) {
            if (-not (Test-Path $install)) { $deleted=$true; Write-Host "Install directory removed after $i second(s)."; break }
            Start-Sleep -Seconds 1
          }
          if (-not $deleted) {
            Write-Host '===== cleanup script state ====='
            Get-ChildItem $env:TEMP -Filter 'TiAlloyStudio-remove-*.cmd' -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.FullName) ---"
              Get-Content $_.FullName | Out-Host
            }
            Write-Host '===== cleanup-related processes ====='
            Get-CimInstance Win32_Process | Where-Object {
              $_.Name -in @('cmd.exe','conhost.exe') -or $_.CommandLine -like '*TiAlloyStudio-remove-*'
            } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List | Out-Host
            Write-Host '===== residual install directory ====='
            Get-ChildItem $install -Force -ErrorAction SilentlyContinue | Select-Object Name,Length,LastWriteTime | Format-Table | Out-Host
            Write-Host '===== registry state ====='
            reg.exe QUERY 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\TiAlloyStudio' | Out-Host
            throw 'Installation directory still exists 120 seconds after uninstaller exit'
          }

          Start-Sleep -Seconds 2
          $orphanCleanupShells=@(Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq 'cmd.exe' -and $_.CommandLine -like '*TiAlloyStudio-remove-*'
          })
          if ($orphanCleanupShells.Count -gt 0) {
            Write-Host '===== orphan cleanup shells ====='
            $orphanCleanupShells | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List | Out-Host
            throw 'Uninstall left an orphan cleanup cmd.exe process'
          }

          reg.exe QUERY 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\TiAlloyStudio' *> $null
          $regCode=$LASTEXITCODE
          if ($regCode -eq 0) { throw 'Windows uninstall registration still exists after uninstall' }
          Write-Host 'Uninstall registration removed.'
          Write-Host 'uninstall-PASS'
          exit 0

      - name: Write release hashes
        shell: pwsh
        run: |
          $files = @(
            'docs\TiAlloyStudio-Manual.docx',
            'internal\installer\payload\engine-bundle.zip',
            'internal\installer\payload\TiAlloyStudio.exe',
            'dist\TiAlloyStudio-Setup-x64-Offline.exe'
          )
          $lines = foreach ($f in $files) {
            $h=(Get-FileHash -Algorithm SHA256 $f).Hash.ToLowerInvariant()
            "$h  $f"
          }
          $lines | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Write Phase 3 R3 acceptance report
        shell: pwsh
        run: |
          $native=Get-Content "$env:RUNNER_TEMP\tialloy-installed-native.json" -Raw | ConvertFrom-Json
          $engines=Get-Content "$env:RUNNER_TEMP\tialloy-installed-engines.json" -Raw | ConvertFrom-Json
          $hashes=Get-Content 'dist\SHA256SUMS.txt'
          $engineLines=@()
          foreach ($e in $engines.engines) {
            $engineLines += "- $($e.name): $($e.status) — $($e.version)"
          }
          $report=@"
          # Ti Alloy Studio — Phase 3 R3 Acceptance Report

          ## Release identity

          - Repository: Dongdayin/Ti_Alloy_Studio
          - Branch: r3-offline
          - Commit: $env:GITHUB_SHA
          - Windows workflow run: $env:GITHUB_RUN_ID
          - Windows runner: windows-latest
          - Installation mode: fully offline, user-selectable install directory

          ## Release gates

          - Go full test suite: PASS
          - go vet: PASS
          - Final 28-page Word manual byte-identity gate: PASS
          - Offline engine-bundle completeness gate: PASS
          - Windows pre-install native scientific smoke: PASS
          - Clean Windows temporary-directory installation: PASS
          - Installed native scientific smoke: PASS
          - Immutable revision edit, historical re-export and portable project round trip: PASS
          - Installed mature-engine cross-check: PASS
          - Windows uninstall registration: PASS
          - Actual uninstall and installation-directory removal: PASS
          - Release SHA256 generation: PASS
          - Tachyon-style bundled renderer UI gate: PASS

          ## Native scientific smoke

          - Status: $($native.result.status)
          - Atom count: $($native.result.atoms)
          - Ti-6Al-4V 192-site integer allocation: Ti=$($native.result.counts.Ti), Al=$($native.result.counts.Al), V=$($native.result.counts.V)
          - Geometry structures in smoke series: $($native.result.series_points)
          - Checks: $($native.result.checks -join '; ')

          ## Bundled mature-engine cross-check

          $($engineLines -join "`n")

          ## SHA256

          ```text
          $($hashes -join "`n")
          ```

          ## Phase 3 R3 boundary

          Phase 3 R3 prepares parameterized downstream calculation input packages from verified titanium-alloy structures and improves large-model generation latency by deferring format-specific export hashes until a user actually exports that format. It can package VASP, LAMMPS and GPUMD/NEP starter inputs with user-selected template parameters, but it does not run solvers, fit EOS curves, calculate GSFE energies, train NEP models, or invent energies, forces or stresses. All exported structures remain explicitly not_relaxed and not_calculated until an external calculation produces real results.
          "@
          $report | Set-Content -LiteralPath 'dist\Phase3-R3-Acceptance-Report.md' -Encoding utf8
          Get-Content 'dist\Phase3-R3-Acceptance-Report.md'

      - name: Upload offline release artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiAlloyStudio-Phase3-R3-Offline-Windows-x64
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/TiAlloyStudio-Setup-x64-Offline.exe
            dist/SHA256SUMS.txt
            dist/Phase3-R3-Acceptance-Report.md
            docs/TiAlloyStudio-Manual.docx
            internal/installer/payload/THIRD_PARTY_NOTICES.txt
