name: Build R3 Offline Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - r3-offline
    tags:
      - 'r3-offline-*'

permissions:
  contents: read

jobs:
  build-windows-offline:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Set up Python 3.11 release-builder runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Build verified fully-offline installer
        shell: pwsh
        run: ./scripts/build_r3_offline.ps1

      - name: Verify final manual byte identity
        shell: pwsh
        run: |
          $expected='0389d2d967023c2a77fafc1e15ec0dfde28e0725b354672388ae2892a78edfda'
          $docs=(Get-FileHash -Algorithm SHA256 'docs\TiAlloyStudio-Manual.docx').Hash.ToLowerInvariant()
          $payload=(Get-FileHash -Algorithm SHA256 'internal\installer\payload\TiAlloyStudio-Manual.docx').Hash.ToLowerInvariant()
          if ($docs -ne $expected -or $payload -ne $expected) { throw "Manual identity failed: docs=$docs payload=$payload" }
          Write-Host "manual-sha256=$docs"

      - name: Run Windows-native core smoke test before install
        shell: pwsh
        run: |
          $smoke="$env:RUNNER_TEMP\tialloy-preinstall-native.json"
          $proc=Start-Process -FilePath '.\internal\installer\payload\TiAlloyStudio.exe' -ArgumentList @('--smoke-test-file',$smoke) -Wait -PassThru
          if (Test-Path $smoke) { Get-Content $smoke }
          else { throw 'Smoke JSON file was not created.' }
          if ($proc.ExitCode -ne 0) { throw "Windows pre-install native smoke executable failed with exit $($proc.ExitCode)" }
          $native=Get-Content $smoke -Raw | ConvertFrom-Json
          if ($native.result.status -ne 'PASS') { throw 'Windows pre-install native smoke failed' }

      - name: Verify payload is offline and complete
        shell: pwsh
        run: |
          $bundle = 'internal\installer\payload\engine-bundle.zip'
          if ((Get-Item $bundle).Length -lt 50MB) { throw 'Engine bundle too small' }
          if (Select-String -Path 'internal\installer\installer.go','cmd\installer\main.go' -Pattern 'Invoke-WebRequest|https?://|pip install --upgrade' -Quiet) {
            throw 'End-user installer source contains forbidden online-install behavior'
          }

      - name: Clean-install final offline installer
        shell: pwsh
        run: |
          $install=Join-Path $env:RUNNER_TEMP 'TiAlloyStudio-CleanInstall'
          $diag=Join-Path $env:RUNNER_TEMP 'TiAlloyStudio-install-error.log'
          Remove-Item $diag -Force -ErrorAction SilentlyContinue
          if (Test-Path $install) { Remove-Item $install -Recurse -Force }
          $proc=Start-Process -FilePath '.\dist\TiAlloyStudio-Setup-x64-Offline.exe' -ArgumentList @('--quiet','--install-dir',$install,'--no-launch') -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $diag) {
              Write-Host '===== preserved installer diagnostic ====='
              Get-Content $diag
              Write-Host '===== end installer diagnostic ====='
            } else {
              Write-Host 'Installer did not create the expected preserved diagnostic file.'
            }
            throw "Offline installer exited $($proc.ExitCode)"
          }
          if (-not (Test-Path "$install\TiAlloyStudio.exe")) { throw 'Installed application missing' }
          if (-not (Test-Path "$install\engines\python\python.exe")) { throw 'Installed private Python runtime missing' }
          if (-not (Test-Path "$install\engines\atomsk\atomsk.exe")) { throw 'Installed Atomsk missing' }
          $expected='0389d2d967023c2a77fafc1e15ec0dfde28e0725b354672388ae2892a78edfda'
          $installedManual=(Get-FileHash -Algorithm SHA256 "$install\TiAlloyStudio-Manual.docx").Hash.ToLowerInvariant()
          if ($installedManual -ne $expected) { throw "Installed manual hash mismatch: $installedManual" }
          reg.exe QUERY 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\TiAlloyStudio' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows uninstall registration missing' }
          "TI_ALLOY_CLEAN_INSTALL=$install" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run installed native and mature-engine smoke tests
        shell: pwsh
        run: |
          $install=$env:TI_ALLOY_CLEAN_INSTALL
          $nativePath="$env:RUNNER_TEMP\tialloy-installed-native.json"
          $nativeProc=Start-Process -FilePath "$install\TiAlloyStudio.exe" -ArgumentList @('--smoke-test-file',$nativePath) -Wait -PassThru
          if (Test-Path $nativePath) { Get-Content $nativePath }
          else { throw 'Installed native smoke JSON was not created.' }
          if ($nativeProc.ExitCode -ne 0) { throw "Installed native smoke executable failed with exit $($nativeProc.ExitCode)" }
          $native=Get-Content $nativePath -Raw | ConvertFrom-Json
          if ($native.result.status -ne 'PASS') { throw 'Installed native scientific smoke failed' }
          $enginePath="$env:RUNNER_TEMP\tialloy-installed-engines.json"
          $engineProc=Start-Process -FilePath "$install\TiAlloyStudio.exe" -ArgumentList @('--engine-smoke-file',$enginePath) -Wait -PassThru
          if (Test-Path $enginePath) { Get-Content $enginePath }
          else { throw 'Installed mature-engine smoke JSON was not created.' }
          if ($engineProc.ExitCode -ne 0) { throw "Installed engine smoke executable failed with exit $($engineProc.ExitCode)" }
          $engine=Get-Content $enginePath -Raw | ConvertFrom-Json
          if ($engine.status -ne 'PASS') { throw 'Installed mature-engine cross-check failed' }

      - name: Verify uninstall from clean installation
        shell: pwsh
        run: |
          $install=$env:TI_ALLOY_CLEAN_INSTALL
          $uninstallProc=Start-Process -FilePath "$install\Uninstall.exe" -ArgumentList @('--uninstall','--quiet') -PassThru
          $exited=$uninstallProc.WaitForExit(30000)
          if (-not $exited) {
            Write-Host "Uninstaller PID $($uninstallProc.Id) did not exit within 30 seconds."
            Write-Host '===== process snapshot ====='
            Get-CimInstance Win32_Process | Where-Object {
              $_.ProcessId -eq $uninstallProc.Id -or $_.ParentProcessId -eq $uninstallProc.Id
            } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List | Out-Host
            Write-Host '===== registry snapshot ====='
            reg.exe QUERY 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\TiAlloyStudio' | Out-Host
            Write-Host '===== install directory snapshot ====='
            if (Test-Path $install) { Get-ChildItem $install -Force | Select-Object Name,Length,LastWriteTime | Format-Table | Out-Host }
            Stop-Process -Id $uninstallProc.Id -Force -ErrorAction SilentlyContinue
            throw 'Uninstaller process timeout'
          }
          if ($uninstallProc.ExitCode -ne 0) { throw "Uninstaller exited $($uninstallProc.ExitCode)" }
          Start-Sleep -Seconds 6
          if (Test-Path $install) { throw 'Installation directory still exists after uninstall' }
          reg.exe QUERY 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\TiAlloyStudio' *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Windows uninstall registration still exists after uninstall' }

      - name: Write release hashes
        shell: pwsh
        run: |
          $files = @(
            'docs\TiAlloyStudio-Manual.docx',
            'internal\installer\payload\engine-bundle.zip',
            'internal\installer\payload\TiAlloyStudio.exe',
            'dist\TiAlloyStudio-Setup-x64-Offline.exe'
          )
          $lines = foreach ($f in $files) {
            $h=(Get-FileHash -Algorithm SHA256 $f).Hash.ToLowerInvariant()
            "$h  $f"
          }
          $lines | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Upload offline release artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiAlloyStudio-R3-Offline-Windows-x64
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/TiAlloyStudio-Setup-x64-Offline.exe
            dist/SHA256SUMS.txt
            docs/TiAlloyStudio-Manual.docx
            internal/installer/payload/THIRD_PARTY_NOTICES.txt
